name: js

on:
  push:
    branches: [main]
    paths: ["js/**", "spec/**", ".github/workflows/js.yml"]
  pull_request:
    paths: ["js/**", "spec/**", ".github/workflows/js.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
