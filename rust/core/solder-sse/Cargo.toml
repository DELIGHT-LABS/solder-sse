[package]
name = "solder-sse"
version = "0.1.0"
edition = "2021"
description = "Resumable Server-Sent Events for Rust: monotonic ids, Last-Event-ID replay, resync, event keep-alive — on http/http-body, framework adapters on top"
license = "MIT"
repository = "https://github.com/DELIGHT-LABS/dosi-rak"
keywords = ["sse", "server-sent-events", "eventsource", "resumable", "http"]
categories = ["web-programming", "asynchronous"]

[dependencies]
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
