[workspace]
resolver = "2"
members = ["core/*", "server/*", "client/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Verified with `cargo +1.88 check --workspace --all-targets`; the floor is set by the dependency graph (icu via url).
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DELIGHT-LABS/solder-sse"
authors = ["DELIGHT LABS <contact@delightlabs.io>"]

[workspace.dependencies]
solder-sse = { path = "core/solder-sse", version = "0.1.0" }
solder-sse-server = { path = "server/solder-sse-server", version = "0.1.0" }
solder-sse-axum = { path = "server/solder-sse-axum", version = "0.1.0" }
solder-sse-client = { path = "client/solder-sse-client", version = "0.1.0" }

bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
axum = "0.8"
axum-core = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
tower = { version = "0.5", features = ["util"] }
